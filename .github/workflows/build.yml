name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test the PDF engine
        run: npm test

      - name: Build installer (works on Intel/AMD and ARM Surface laptops)
        shell: bash
        run: |
          npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          npx electron-builder --win nsis --x64 --arm64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Markup-Setup
          path: dist/*.exe

      - name: Publish release (easy download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PDF Markup for Windows, build ${{ github.run_number }}
          files: dist/*.exe
